<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Académico | UPLA</title>
    <!-- Supabase JS Client desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ==================== ESTILOS CSS ==================== */
        :root {
            --bg-main: #0B0B0D;
            --card-bg: #2A2A2E;
            --card-border: #3A3A40;
            --text-main: #F0F0F5;
            --text-muted: #D1D1D6;
            --silver-glow: #8A8A93;
            --silver-bright: #E5E5EA;
            --danger: #902A2A;
            --danger-hover: #B83A3A;
            --accent: #4A4A52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Fondo (Animación de Humo) */
        #smokeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* ==================== AUTENTICACIÓN ==================== */
        .auth-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: rgba(42, 42, 46, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(229, 229, 234, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .auth-card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 25px rgba(229, 229, 234, 0.2);
        }

        .branding {
            text-align: center;
            margin-bottom: 20px;
        }

        .branding img {
            max-width: 160px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--silver-bright);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #121214;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--silver-bright);
            box-shadow: 0 0 8px rgba(229, 229, 234, 0.3);
        }

        .avatar-preview {
            margin-top: 10px;
            text-align: center;
        }

        .avatar-preview img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--silver-bright);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #3A3A40;
            color: var(--silver-bright);
            border: 1px solid var(--silver-glow);
        }

        .btn-primary:hover {
            background: #4A4A52;
            box-shadow: 0 0 12px rgba(240, 240, 245, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--card-border);
        }

        .btn-secondary:hover {
            color: var(--silver-bright);
            border-color: var(--silver-bright);
            box-shadow: 0 0 10px rgba(240, 240, 245, 0.2);
        }

        .btn-danger {
            background: var(--danger);
            color: #FFF;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-sm {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-auth a {
            color: var(--silver-bright);
            text-decoration: none;
        }

        /* ==================== DASHBOARD ==================== */
        .dashboard-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }

        .main-header {
            background: rgba(18, 18, 20, 0.9);
            border-bottom: 1px solid var(--card-border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-branding img {
            max-width: 120px;
        }

        .header-user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .header-user-profile:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .header-user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--silver-bright);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .user-code {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .teacher-banner {
            background: #5A3A00;
            color: #FFD700;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Cuerpo Académico */
        .academic-body {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
            color: var(--silver-bright);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .course-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #3A3A40;
            color: var(--silver-bright);
            border-color: var(--silver-bright);
            box-shadow: 0 0 12px rgba(240, 240, 245, 0.25);
        }

        /* Unidades y Semanas */
        .unit-block {
            background: rgba(42, 42, 46, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-bottom: 30px;
            padding: 20px;
        }

        .unit-title {
            font-size: 1.4rem;
            color: var(--silver-bright);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .weeks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .week-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .week-card:hover {
            transform: translateY(-3px);
            border-color: var(--silver-glow);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(240, 240, 245, 0.2);
        }

        .week-header h4 {
            font-size: 1rem;
            color: var(--silver-bright);
            margin-bottom: 8px;
        }

        .week-topic-input {
            width: 100%;
            background: #121214;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .week-topic-input:read-only {
            background: transparent;
            border-color: transparent;
        }

        .file-dropzone {
            border: 1px dashed var(--card-border);
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .file-item {
            background: #121214;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .file-info {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .file-actions {
            display: flex;
            gap: 5px;
        }

        .file-actions button, .file-actions a {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            cursor: pointer;
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--silver-glow);
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 0 25px rgba(250, 250, 250, 0.15);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .main-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .course-tabs {
                flex-direction: column;
            }
        }
    </style>
</head>

    <div id="authContainer" class="auth-container">

    <!-- ==================== VISTA 2: DASHBOARD PRINCIPAL ==================== -->
    <div id="dashboardContainer" class="dashboard-container hidden">
        <!-- Header -->

        <!-- Contenido Académico -->

    <!-- Modal de Edición de Perfil -->
    <div id="profileModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeProfileModal">&times;</span>
            <h2>Editar Perfil de Usuario</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="editNames">Nombres y Apellidos</label>

                        <option value="I">Ciclo I</option>

                        <option value="III">Ciclo III</option>
                        <option value="IV">Ciclo IV</option>
                        <option value="V">Ciclo V</option>
                        <option value="VI">Ciclo VI</option>
                        <option value="VII">Ciclo VII</option>
                        <option value="VIII">Ciclo VIII</option>

    <!-- ==================== LÓGICA JAVASCRIPT ==================== -->
    <script>
        // 1. CONFIGURACIÓN DE SUPABASE (Reemplazar con tus credenciales de Supabase)
        const SUPABASE_URL = "https://TU_PROYECTO.supabase.co";
        const SUPABASE_ANON_KEY = "TU_CLAVE_ANON_PUBLICA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. CANVAS DE ANIMACIÓN DE HUMO & SILUETAS
        (function initSmokeCanvas() {
            const canvas = document.getElementById("smokeCanvas");
            const ctx = canvas.getContext("2d");

            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const mouse = { x: width / 2, y: height / 2 };
            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            class SmokeParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 100;
                    this.size = Math.random() * 40 + 20;
                    this.speedY = Math.random() * 0.8 + 0.3;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.3 + 0.05;
                    this.isSkullForm = Math.random() < 0.15;
                }
                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) { this.x -= (dx / dist) * 0.8; }
                    if (this.y < -50 || this.opacity <= 0) { this.reset(); }
                }
                draw() {
                    ctx.save();
                    ctx.beginPath();
                    let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    gradient.addColorStop(0, `rgba(240, 240, 245, ${this.opacity})`);
                    gradient.addColorStop(0.5, `rgba(138, 138, 147, ${this.opacity * 0.5})`);
                    gradient.addColorStop(1, "rgba(11, 11, 13, 0)");
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();

                    if (this.isSkullForm && this.opacity > 0.15) {
                        ctx.fillStyle = `rgba(225, 225, 235, ${this.opacity * 0.8})`;
                        ctx.beginPath();
                        ctx.arc(this.x - this.size * 0.25, this.y - this.size * 0.1, this.size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(this.x + this.size * 0.25, this.y - this.size * 0.1, this.size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            const particles = Array.from({ length: 65 }, () => new SmokeParticle());
            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach((p) => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // 3. LÓGICA DE APLICACIÓN Y NAVEGACIÓN
        let currentUser = null;
        let isTeacherMode = false;
        let currentCourse = "algoritmos";

        document.addEventListener("DOMContentLoaded", () => {
            setupEventListeners();
            checkExistingSession();
        });

        function setupEventListeners() {
            document.getElementById("linkToRegister").addEventListener("click", (e) => {
                e.preventDefault();
                document.getElementById("loginCard").classList.add("hidden");
                document.getElementById("registerCard").classList.remove("hidden");
            });

            document.getElementById("linkToLogin").addEventListener("click", (e) => {
                e.preventDefault();
                document.getElementById("registerCard").classList.add("hidden");
                document.getElementById("loginCard").classList.remove("hidden");
            });

            document.getElementById("regPhoto").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) { document.getElementById("regPhotoPreview").src = URL.createObjectURL(file); }
            });

            document.getElementById("loginForm").addEventListener("submit", handleLogin);
            document.getElementById("registerForm").addEventListener("submit", handleRegister);
            document.getElementById("btnTeacherAccess").addEventListener("click", enableTeacherMode);
            document.getElementById("btnLogout").addEventListener("click", handleLogout);

            document.getElementById("userProfileBtn").addEventListener("click", openProfileModal);
            document.getElementById("closeProfileModal").addEventListener("click", () => {
                document.getElementById("profileModal").classList.add("hidden");
            });
            document.getElementById("editProfileForm").addEventListener("submit", handleUpdateProfile);

            document.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
                    e.target.classList.add("active");
                    currentCourse = e.target.dataset.course;
                    renderAcademicStructure();
                });
            });
        }

        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { fetchUserProfile(session.user.id); } 
            else { showAuthView(); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { alert("Error: " + error.message); return; }
            isTeacherMode = false;
            fetchUserProfile(data.user.id);
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;
            const names = document.getElementById("regNames").value;
            const code = document.getElementById("regCode").value;
            const career = document.getElementById("regCareer").value;
            const cycle = document.getElementById("regCycle").value;
            const photoFile = document.getElementById("regPhoto").files[0];

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { alert("Error en el registro: " + error.message); return; }

            let photoUrl = "https://via.placeholder.com/100";
            if (photoFile) { photoUrl = await uploadProfilePhoto(data.user.id, photoFile); }

            await supabase.from("profiles").insert([{
                id: data.user.id,
                full_name: names,
                student_code: code,
                career: career,
                cycle: cycle,
                avatar_url: photoUrl
            }]);

            alert("Cuenta registrada.");
            fetchUserProfile(data.user.id);
        }

        function enableTeacherMode() {
            isTeacherMode = true;
            currentUser = {
                full_name: "Docente / Invitado",
                student_code: "UPLA-DOCENTE",
                avatar_url: "https://via.placeholder.com/80?text=Profesor"
            };
            showDashboardView();
        }

        async function handleLogout() {
            if (!isTeacherMode) { await supabase.auth.signOut(); }
            currentUser = null;
            isTeacherMode = false;
            showAuthView();
        }

        async function fetchUserProfile(userId) {
            const { data } = await supabase.from("profiles").select("*").eq("id", userId).single();
            currentUser = data;
            showDashboardView();
        }

        function showAuthView() {
            document.getElementById("authContainer").classList.remove("hidden");
            document.getElementById("dashboardContainer").classList.add("hidden");
        }

        function showDashboardView() {
            document.getElementById("authContainer").classList.add("hidden");
            document.getElementById("dashboardContainer").classList.remove("hidden");

            document.getElementById("headerAvatar").src = currentUser.avatar_url || "https://via.placeholder.com/40";
            document.getElementById("headerName").textContent = currentUser.full_name;
            document.getElementById("headerCode").textContent = `Cód: ${currentUser.student_code}`;

            if (isTeacherMode) {
                document.getElementById("teacherBanner").classList.remove("hidden");
            } else {
                document.getElementById("teacherBanner").classList.add("hidden");
            }

            renderAcademicStructure();
        }

        async function renderAcademicStructure() {
            const container = document.getElementById("courseContent");
            container.innerHTML = "";

            const { data: dbWeeks } = await supabase.from("weeks")
                .select("*, tasks(*)")
                .eq("course_id", currentCourse);

            const weekMap = {};
            if (dbWeeks) { dbWeeks.forEach(w => weekMap[w.week_number] = w); }

            const units = [
                { name: "Unidad I", start: 1, end: 4 },
                { name: "Unidad II", start: 5, end: 8 },
                { name: "Unidad III", start: 9, end: 12 },
                { name: "Unidad IV", start: 13, end: 16 }
            ];

            units.forEach(unit => {
                const unitEl = document.createElement("div");
                unitEl.className = "unit-block";
                unitEl.innerHTML = `<h3 class="unit-title">${unit.name}</h3>`;

                const grid = document.createElement("div");
                grid.className = "weeks-grid";

                for (let w = unit.start; w <= unit.end; w++) {
                    const weekData = weekMap[w] || { title: `Semana ${w}`, tasks: [] };
                    grid.appendChild(createWeekCard(w, weekData));
                }

                unitEl.appendChild(grid);
                container.appendChild(unitEl);
            });
        }

        function createWeekCard(weekNum, weekData) {
            const card = document.createElement("div");
            card.className = "week-card";

            const isReadOnly = isTeacherMode ? "readonly" : "";
            const task = weekData.tasks && weekData.tasks.length > 0 ? weekData.tasks[0] : null;

            let taskHtml = "";
            if (task) {
                taskHtml = `
                    <div class="file-item">
                        <span class="file-info" title="${task.file_name}">📄 ${task.file_name}</span>
                        <div class="file-actions">
                            <a href="${task.file_url}" target="_blank" download class="btn-primary">⬇</a>
                            ${!isTeacherMode ? `<button class="btn-danger" onclick="deleteTask('${task.id}', '${task.storage_path}')">🗑</button>` : ''}
                        </div>
                    </div>
                `;
            } else if (!isTeacherMode) {
                taskHtml = `
                    <div class="file-dropzone">
                        <input type="file" id="file_week_${weekNum}" onchange="uploadTask(${weekNum}, this)" style="display:none">
                        <label for="file_week_${weekNum}" style="cursor:pointer">➕ Subir Tarea (.zip, .pdf, .docx...)</label>
                    </div>
                `;
            } else {
                taskHtml = `<p style="font-size:0.8rem; color:#888; margin-top:10px;">Sin tarea entregada</p>`;
            }

            card.innerHTML = `
                <div class="week-header">
                    <h4>Semana ${weekNum}</h4>
                    <input type="text" class="week-topic-input" ${isReadOnly} 
                           value="${weekData.title || ''}" 
                           placeholder="Título del Tema..." 
                           onchange="updateWeekTitle(${weekNum}, this.value)">
                </div>
                <div class="week-body">
                    ${taskHtml}
                </div>
            `;

            return card;
        }

        async function uploadTask(weekNum, input) {
            const file = input.files[0];
            if (!file || isTeacherMode) return;

            const fileExt = file.name.split('.').pop();
            const filePath = `${currentUser.id}/${currentCourse}/sem_${weekNum}_${Date.now()}.${fileExt}`;

            const { data: storageData, error: storageErr } = await supabase.storage
                .from('academic_files')
                .upload(filePath, file);

            if (storageErr) { alert("Error al subir archivo: " + storageErr.message); return; }

            const { data: { publicUrl } } = supabase.storage.from('academic_files').getPublicUrl(filePath);

            let { data: weekObj } = await supabase.from('weeks')
                .select('id')
                .eq('course_id', currentCourse)
                .eq('week_number', weekNum)
                .single();

            if (!weekObj) {
                const { data: newWeek } = await supabase.from('weeks').insert([{
                    course_id: currentCourse,
                    week_number: weekNum,
                    title: `Semana ${weekNum}`
                }]).select().single();
                weekObj = newWeek;
            }

            await supabase.from('tasks').insert([{
                week_id: weekObj.id,
                file_name: file.name,
                file_url: publicUrl,
                storage_path: filePath,
                file_size: file.size
            }]);

            renderAcademicStructure();
        }

        async function deleteTask(taskId, storagePath) {
            if (isTeacherMode || !confirm("¿Eliminar este archivo?")) return;
            await supabase.storage.from('academic_files').remove([storagePath]);
            await supabase.from('tasks').delete().eq('id', taskId);
            renderAcademicStructure();
        }

        async function updateWeekTitle(weekNum, newTitle) {
            if (isTeacherMode) return;
            await supabase.from('weeks').upsert({
                course_id: currentCourse,
                week_number: weekNum,
                title: newTitle
            }, { onConflict: 'course_id, week_number' });
        }

        function openProfileModal() {
            if (isTeacherMode) return;
            document.getElementById("editNames").value = currentUser.full_name;
            document.getElementById("editCode").value = currentUser.student_code;
            document.getElementById("editCareer").value = currentUser.career;
            document.getElementById("editCycle").value = currentUser.cycle;
            document.getElementById("profileModal").classList.remove("hidden");
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            if (isTeacherMode) return;

            const names = document.getElementById("editNames").value;
            const code = document.getElementById("editCode").value;
            const career = document.getElementById("editCareer").value;
            const cycle = document.getElementById("editCycle").value;
            const photoFile = document.getElementById("editPhoto").files[0];

            let photoUrl = currentUser.avatar_url;
            if (photoFile) { photoUrl = await uploadProfilePhoto(currentUser.id, photoFile); }

            await supabase.from("profiles").update({
                full_name: names,
                student_code: code,
                career: career,
                cycle: cycle,
                avatar_url: photoUrl
            }).eq("id", currentUser.id);

            document.getElementById("profileModal").classList.add("hidden");
            fetchUserProfile(currentUser.id);
        }

        async function uploadProfilePhoto(userId, file) {
            const filePath = `avatars/${userId}_${Date.now()}`;
            await supabase.storage.from('academic_files').upload(filePath, file);
            const { data: { publicUrl } } = supabase.storage.from('academic_files').getPublicUrl(filePath);
            return publicUrl;
        }
    </script>
</body>
</html>
