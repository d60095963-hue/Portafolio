<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Académico - UPLA</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: rgba(22, 22, 26, 0.85);
      --border-smoke: #3a3a42;
      --text-smoke: #e1e1e6;
      --text-dim: #9393a0;
      --accent-smoke: #d1d1e0;
      --danger: #e65050;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-smoke);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo animado estilo Aura de Humo */
    .smoke-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 50% 50%, rgba(50, 50, 65, 0.3) 0%, rgba(10, 10, 12, 1) 80%);
    }

    .smoke-aura {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(180, 180, 200, 0.08);
      border-radius: 50%;
      filter: blur(60px);
      animation: floatSmoke 8s infinite alternate ease-in-out;
    }

    @keyframes floatSmoke {
      0% { transform: translate(-10%, -10%) scale(1); opacity: 0.3; }
      100% { transform: translate(20%, 20%) scale(1.3); opacity: 0.6; }
    }

    /* Vistas (Login y Panel Principal) */
    .view-section {
      display: none;
      width: 100%;
      min-height: 100vh;
    }

    .view-active {
      display: flex;
      flex-direction: column;
    }

    /* Estilos Login / Registro */
    .auth-container {
      margin: auto;
      width: 90%;
      max-width: 450px;
      background: var(--panel-bg);
      border: 1px solid var(--border-smoke);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .university-logo-slot {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      border: 2px dashed var(--border-smoke);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .university-logo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-dim);
      display: block;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #121216;
      border: 1px solid var(--border-smoke);
      border-radius: 6px;
      color: var(--text-smoke);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #2a2a32;
      border: 1px solid var(--border-smoke);
      color: var(--text-smoke);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #3f3f4c;
      border-color: var(--accent-smoke);
    }

    .btn-secondary {
      background: transparent;
      border-color: transparent;
      color: var(--text-dim);
    }

    .btn-secondary:hover {
      color: var(--text-smoke);
      background: transparent;
    }

    /* Layout Dashboard Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-smoke);
    }

    .profile-badge, .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #222;
      border: 1px solid var(--border-smoke);
      object-fit: cover;
    }

    /* Contenido Principal Cursos */
    main {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .course-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab-btn {
      padding: 12px 24px;
      background: var(--panel-bg);
      border: 1px solid var(--border-smoke);
      color: var(--text-dim);
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text-smoke);
      border-color: var(--accent-smoke);
      background: #25252e;
    }

    .units-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .unit-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-smoke);
      border-radius: 10px;
      padding: 20px;
    }

    .unit-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--accent-smoke);
      border-bottom: 1px solid var(--border-smoke);
      padding-bottom: 8px;
    }

    .week-item {
      background: #121216;
      border: 1px solid var(--border-smoke);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .week-header {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text-dim);
    }

    .work-list {
      margin-top: 8px;
      list-style: none;
    }

    .work-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      padding: 6px 0;
      border-top: 1px dotted var(--border-smoke);
    }

    .work-item a {
      color: #8a8afe;
      text-decoration: none;
    }

    .btn-delete {
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Modal Modificar Perfil */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      padding: 25px;
      border-radius: 10px;
      border: 1px solid var(--border-smoke);
      width: 90%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="smoke-bg">
    <div class="smoke-aura" style="top:20%; left:20%;"></div>
    <div class="smoke-aura" style="top:60%; left:70%;"></div>
  </div>

  <!-- SECCIÓN: LOGIN / REGISTRO -->
  <div id="authView" class="view-section view-active" style="justify-content: center;">
    <div class="auth-container">
      <div class="university-logo-slot" onclick="document.getElementById('uniLogoInput').click()">
        <img id="uniLogoPreview" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%239393a0' viewBox='0 0 24 24'><path d='M12 3L1 9l11 6 9-4.91V17h2V9L12 3z'/></svg>" alt="Logo UPLA">
      </div>
      <input type="file" id="uniLogoInput" accept="image/*" style="display:none;" onchange="updateLogo(this)">

      <h2 style="margin-bottom: 20px;">Universidad Peruana los Andes</h2>

      <!-- Formulario Inicio de Sesión -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Código Universitario</label>
          <input type="text" id="loginCode" required placeholder="Ej: U20231012">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPass" required>
        </div>
        <button type="submit" class="btn">Iniciar Sesión</button>
        <button type="button" class="btn btn-secondary" onclick="toggleAuth('register')">¿No tienes cuenta? Regístrate</button>
        <button type="button" class="btn" style="margin-top:15px; background:#1b281b;" onclick="teacherAccess()">Acceso Directo Profesor</button>
      </form>

      <!-- Formulario Registro -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
        <div class="form-group">
          <label>Nombres y Apellidos</label>
          <input type="text" id="regName" required>
        </div>
        <div class="form-group">
          <label>Código Universitario</label>
          <input type="text" id="regCode" required>
        </div>
        <div class="form-group">
          <label>Carrera Universitaria</label>
          <input type="text" id="regCareer" value="Ingeniería de Sistemas" required>
        </div>
        <div class="form-group">
          <label>Ciclo</label>
          <input type="text" id="regCycle" value="3er Ciclo" required>
        </div>
        <div class="form-group">
          <label>Foto de Perfil</label>
          <input type="file" id="regAvatar" accept="image/*">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="regPass" required>
        </div>
        <button type="submit" class="btn">Crear Cuenta</button>
        <button type="button" class="btn btn-secondary" onclick="toggleAuth('login')">Volver al Login</button>
      </form>
    </div>
  </div>

  <!-- SECCIÓN: PANEL PRINCIPAL (DASHBOARD) -->
  <div id="dashboardView" class="view-section">
    <header>
      <div class="header-logo" onclick="document.getElementById('uniLogoInput').click()">
        <img id="headerUniLogo" src="" class="avatar" alt="UPLA Logo">
        <span style="font-weight:bold; font-size: 0.9rem;">UPLA</span>
      </div>
      <div class="profile-badge" onclick="openProfileModal()">
        <img id="userAvatar" class="avatar" src="" alt="Perfil">
        <div>
          <div id="userName" style="font-size:0.9rem; font-weight:bold;">Usuario</div>
          <div id="userDetails" style="font-size:0.75rem; color:var(--text-dim);">3er Ciclo</div>
        </div>
      </div>
    </header>

    <main>
      <div class="course-tabs">
        <button class="tab-btn active" onclick="switchCourse('algoritmos')">Algoritmos y Estructura de datos</button>
        <button class="tab-btn" onclick="switchCourse('desarrollo')">Desarrollo De aplicaciones I</button>
      </div>

      <div id="unitsContainer" class="units-grid">
        <!-- Renderizado dinámico de 4 unidades x 4 semanas -->
      </div>
    </main>
  </div>

  <!-- MODAL: EDITAR PERFIL -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Editar Perfil</h3>
      <div class="form-group">
        <label>Nombre y Apellido</label>
        <input type="text" id="editName">
      </div>
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" id="editPass" placeholder="Dejar en blanco si no cambia">
      </div>
      <button class="btn" onclick="saveProfileChanges()">Guardar Cambios</button>
      <button class="btn btn-secondary" onclick="closeProfileModal()">Cancelar</button>
      <button class="btn" style="background:var(--danger); margin-top:20px;" onclick="logout()">Cerrar Sesión</button>
    </div>
  </div>

  <script>
    // Estado global de la aplicación
    let activeCourse = 'algoritmos';
    let isTeacherView = false;
    let currentUser = JSON.parse(localStorage.getItem('upla_user')) || null;
    let tasksData = JSON.parse(localStorage.getItem('upla_tasks')) || {};

    // Inicialización
    window.onload = () => {
      const savedLogo = localStorage.getItem('upla_logo');
      if(savedLogo) setLogoImages(savedLogo);
      if(currentUser) showDashboard();
    };

    function toggleAuth(type) {
      document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
    }

    function updateLogo(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          setLogoImages(e.target.result);
          localStorage.setItem('upla_logo', e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function setLogoImages(src) {
      document.getElementById('uniLogoPreview').src = src;
      document.getElementById('headerUniLogo').src = src;
    }

    function handleRegister(e) {
      e.preventDefault();
      const avatarInput = document.getElementById('regAvatar');
      
      const saveUserData = (avatarData) => {
        currentUser = {
          name: document.getElementById('regName').value,
          code: document.getElementById('regCode').value,
          career: document.getElementById('regCareer').value,
          cycle: document.getElementById('regCycle').value,
          pass: document.getElementById('regPass').value,
          avatar: avatarData || 'https://via.placeholder.com/150'
        };
        localStorage.setItem('upla_user', JSON.stringify(currentUser));
        showDashboard();
      };

      if (avatarInput.files && avatarInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => saveUserData(e.target.result);
        reader.readAsDataURL(avatarInput.files[0]);
      } else {
        saveUserData();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const code = document.getElementById('loginCode').value;
      const pass = document.getElementById('loginPass').value;

      if(currentUser && currentUser.code === code && currentUser.pass === pass) {
        isTeacherView = false;
        showDashboard();
      } else {
        alert('Credenciales incorrectas o usuario no registrado.');
      }
    }

    function teacherAccess() {
      isTeacherView = true;
      if(!currentUser) {
        currentUser = { name: "Vista de Profesor", code: "PROFE-01", career: "Docente", cycle: "N/A", avatar: "https://via.placeholder.com/150" };
      }
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('authView').classList.remove('view-active');
      document.getElementById('dashboardView').classList.add('view-active');
      
      document.getElementById('userName').innerText = currentUser.name;
      document.getElementById('userDetails').innerText = `${currentUser.code} | ${currentUser.cycle}`;
      document.getElementById('userAvatar').src = currentUser.avatar;
      
      renderUnits();
    }

    function switchCourse(courseKey) {
      activeCourse = courseKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderUnits();
    }

    function renderUnits() {
      const container = document.getElementById('unitsContainer');
      container.innerHTML = '';

      for (let u = 1; u <= 4; u++) {
        const unitCard = document.createElement('div');
        unitCard.className = 'unit-card';
        unitCard.innerHTML = `<div class="unit-title">Unidad ${u}</div>`;

        for (let w = 1; w <= 4; w++) {
          const weekNum = (u - 1) * 4 + w;
          const weekKey = `${activeCourse}_u${u}_w${weekNum}`;
          const weekTasks = tasksData[weekKey] || [];

          const weekDiv = document.createElement('div');
          weekDiv.className = 'week-item';
          weekDiv.innerHTML = `
            <div class="week-header">Semana ${weekNum}</div>
            ${!isTeacherView ? `
              <input type="text" id="title_${weekKey}" placeholder="Título del trabajo" style="width:100%; margin-bottom:5px; padding:4px; background:#1e1e24; border:1px solid #3a3a42; color:#fff; font-size:0.8rem; border-radius:4px;">
              <input type="url" id="link_${weekKey}" placeholder="Enlace público de Drive / Supabase" style="width:100%; margin-bottom:5px; padding:4px; background:#1e1e24; border:1px solid #3a3a42; color:#fff; font-size:0.8rem; border-radius:4px;">
              <button class="btn" style="padding:4px; font-size:0.75rem;" onclick="uploadTask('${weekKey}')">Subir Trabajo</button>
            ` : ''}
            <ul class="work-list">
              ${weekTasks.map((t, index) => `
                <li class="work-item">
                  <a href="${t.url}" target="_blank" download>${t.title}</a>${!isTeacherView ? `<button class="btn-delete" onclick="deleteTask('${weekKey}', ${index})">Borrar</button>` : ''}
                </li>
              `).join('')}
            </ul>
          `;
          unitCard.appendChild(weekDiv);
        }
        container.appendChild(unitCard);
      }
    }

    function uploadTask(weekKey) {
      const titleInput = document.getElementById(`title_${weekKey}`);
      const linkInput = document.getElementById(`link_${weekKey}`);

      if (!titleInput.value || !linkInput.value) {
        alert('Por favor completa el título y el enlace.');
        return;
      }

      if (!tasksData[weekKey]) tasksData[weekKey] = [];
      tasksData[weekKey].push({ title: titleInput.value, url: linkInput.value });
      
      localStorage.setItem('upla_tasks', JSON.stringify(tasksData));
      renderUnits();
    }

    function deleteTask(weekKey, index) {
      tasksData[weekKey].splice(index, 1);
      localStorage.setItem('upla_tasks', JSON.stringify(tasksData));
      renderUnits();
    }

    function openProfileModal() {
      if(isTeacherView) return;
      document.getElementById('editName').value = currentUser.name;
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function saveProfileChanges() {
      const newName = document.getElementById('editName').value;
      const newPass = document.getElementById('editPass').value;

      if(newName) currentUser.name = newName;
      if(newPass) currentUser.pass = newPass;

      localStorage.setItem('upla_user', JSON.stringify(currentUser));
      showDashboard();
      closeProfileModal();
    }

    function logout() {
      closeProfileModal();
      document.getElementById('dashboardView').classList.remove('view-active');
      document.getElementById('authView').classList.add('view-active');
    }
  </script>
</body>
</html>
